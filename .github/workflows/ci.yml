name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          # Disable built-in Go module cache: the automatic cache restore was
          # failing with "/usr/bin/tar ... exit code 2" and blocking CI.
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 20 reached EOL in 2026-04; use Active LTS 22 to avoid
          # download failures on runners.
          node-version: '22'
          # Disable automatic npm caching to avoid the same tar restore
          # failures seen on the backend job.
          package-manager-cache: false
      - name: Install
        run: cd web && npm ci
      - name: Type check
        run: cd web && npx tsc --noEmit

  pre-merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false
      - uses: actions/setup-node@v5
        with:
          # Must match the frontend job. The gate runs `tsc -b` + `vite build`,
          # which require node_modules to be populated (npm ci below).
          node-version: '22'
          # Disable automatic npm caching to avoid the same tar restore
          # failures seen on the backend job.
          package-manager-cache: false
      - name: Install frontend deps
        # The gate script invokes web/node_modules/.bin/{tsc,vite}; without this
        # step node_modules is empty and the gate fails with "No such file".
        run: cd web && npm ci
      - name: Pre-merge gate
        # Consolidated gate (build + vet + test + frontend build). Mirrors
        # clowder's pre-push / CI gate. --no-rebase because CI checks out a
        # detached HEAD, not a feature branch.
        run: bash scripts/pre-merge-check.sh --no-rebase
